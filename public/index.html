<!DOCTYPE html>
<html lang="km" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- SEO / Meta -->
  <title>SK Cosmetic — Customer Display | ABA PayWay KHQR</title>
  <meta name="description" content="POS Customer-Facing Display for SK Cosmetic. Presents live order details and ABA KHQR payment code for seamless checkout." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Prevent browser caching on kiosk displays -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23E1251B'/><text x='12' y='17' text-anchor='middle' font-size='14' font-weight='900' fill='white' font-family='Arial'>S</text></svg>" />

  <!-- Google Fonts (preconnect for performance) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />

  <!-- qrcode.js — lightweight QR renderer (no build step required) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
          integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSuhUMNZGa6CVog3+p9zjf+6zON5fLk3H2TQ=="
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

<!-- ══════════════════════════════════════════════════════════
     APP SHELL
     ══════════════════════════════════════════════════════════ -->
<div id="app" role="main">

  <!-- ╔══════════════════════════════════════════════════════╗
       ║  SCREEN: IDLE — Welcome / Waiting for Order         ║
       ╚══════════════════════════════════════════════════════╝ -->
  <section id="screen-idle" aria-label="Welcome screen" aria-live="polite">

    <div class="idle-brand-container">
      <img src="https://i.ibb.co/hFCPc9QC/skcos-cover-01.png" alt="SK Cosmetic Logo" class="idle-brand-logo" />
    </div>

    <p class="idle-tagline">
      ស្វាគមន៍! សូមមើលទំនិញ ហើយស្កែន KHQR ដើម្បីបង់ប្រាក់។
    </p>

    <div class="idle-scan-indicator" aria-live="polite" aria-label="Waiting for order">
      <span class="idle-dot" aria-hidden="true"></span>
      <span>Waiting for order&hellip;</span>
    </div>

    <!-- Store ID indicator -->
    <div class="idle-store-indicator" id="idle-store-indicator" aria-label="Active store"></div>

  </section>


  <!-- ╔══════════════════════════════════════════════════════╗
       ║  SCREEN: PENDING — Split Layout (Logo + Order/KHQR) ║
       ╚══════════════════════════════════════════════════════╝ -->
  <section id="screen-pending" class="hidden" aria-label="Order and payment screen" aria-live="polite">

    <!-- ── LEFT PANEL: Brand Logo Hero (50%) ────────────── -->
    <div class="panel-left">

      <div class="brand-hero-wrapper">
        <img src="https://i.ibb.co/hFCPc9QC/skcos-cover-01.png" alt="SK Cosmetic Logo" class="hero-brand-logo" />
      </div>

      <footer class="panel-left-footer">
        <!-- Order reference chip (populated by JS) -->
        <div class="order-ref-chip" id="order-ref-chip" aria-label="Order reference">—</div>
      </footer>

    </div><!-- /panel-left -->


    <!-- ── RIGHT PANEL: Order Details + KHQR (50%) ───────── -->
    <div class="panel-right">

      <div class="right-content-wrapper">

        <!-- Receipt Header -->
        <header class="receipt-header">
          <h2>Order Summary</h2>
        </header>

        <!-- Dynamic Items List (Injected by app.js matching Odoo layout) -->
        <div
          id="items-list"
          class="items-list-container"
          role="list"
          aria-label="Order items"
          aria-live="polite"
        >
          <!-- Dynamic content -->
        </div>

        <!-- Receipt Total Bar -->
        <div class="receipt-total-row" aria-label="Total amount">
          <span class="receipt-total-label">Total</span>
          <span class="receipt-total-value" id="total-amount">$ 0.00</span>
        </div>

        <!-- KHQR Card Container (Popup when Cashier enters Payment screen) -->
        <div class="khqr-card-section hidden-qr" id="khqr-card-section">
          <div class="khqr-outer-card" role="region" aria-label="ABA KHQR payment card">

            <!-- Outer Card Header -->
            <div class="khqr-header">
              <div class="khqr-brand">
                <div class="khqr-logo-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <path d="M14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z" fill="currentColor" stroke="none"/>
                  </svg>
                </div>
                <span class="khqr-logo-text">KHQR</span>
              </div>
              <div class="aba-payway-badge">
                <span class="aba-dot"></span>
                <span>ABA PayWay</span>
              </div>
            </div>

            <!-- Inner Card -->
            <div class="khqr-inner-card">
              <div class="merchant-info">
                <div class="merchant-name-en">SK COSMETIC</div>
                <div class="merchant-name-kh">អេសខេ គ្រឿងក្រអូប</div>
              </div>

              <div class="payment-amount-display">
                <div class="amount-label">Amount to Pay</div>
                <div class="amount-value" id="amount-value">$ 0.00</div>
              </div>

              <div id="qr-container" class="qr-container" role="img" aria-label="ABA KHQR payment QR code">
                <div class="qr-placeholder">
                  <p>Loading QR…</p>
                </div>
              </div>

              <div class="order-ref-badge">
                <span id="order-ref-badge-text">—</span>
              </div>
            </div>

          </div><!-- /khqr-outer-card -->
        </div><!-- /khqr-card-section -->

      </div><!-- /right-content-wrapper -->

    </div><!-- /panel-right -->

  </section><!-- /screen-pending -->


  <!-- ╔══════════════════════════════════════════════════════╗
       ║  SCREEN: SUCCESS — Payment Confirmed Overlay        ║
       ╚══════════════════════════════════════════════════════╝ -->
  <section id="screen-success" class="hidden" aria-label="Payment successful" aria-live="assertive">

    <div class="success-card" role="status">

      <!-- Animated green checkmark ring -->
      <div class="success-icon-ring" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 6L9 17l-5-5" />
        </svg>
      </div>

      <!-- "Payment Successful!" — above "Thank You!" per reviewer requirement -->
      <p class="success-payment-label" id="success-payment-label">
        Payment Successful!
      </p>

      <!-- Main celebration heading -->
      <h2 class="success-title">Thank You!</h2>

      <!-- Subtitle -->
      <p class="success-subtitle">
        Your payment has been received.<br/>
        Please collect your receipt.
      </p>

      <!-- Auto-reset countdown -->
      <div class="success-countdown" aria-live="polite">
        <span class="countdown-dot" aria-hidden="true"></span>
        <span id="countdown-text">Returning in 5s…</span>
      </div>

    </div>

  </section><!-- /screen-success -->

</div><!-- /#app -->

<!-- Client logic — cache-busted on every deploy via ?v= timestamp -->
<script src="/js/app.js?v=20260925_2"></script>

</body>
</html>
